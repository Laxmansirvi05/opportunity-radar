name: CI

# Runs on every pull request and on pushes to main.
#
# Why this exists: between 13 and 23 September 2026, 22 production builds in a
# row failed because package.json had been edited without regenerating the
# lockfile. Nothing ran `npm ci` before the commits reached main, so the first
# signal was a dead deploy pipeline that went unnoticed for four weeks.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Install, type-check, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Fails when package.json and package-lock.json disagree.
      - run: npm ci
      - run: npm run type-check
      - run: npm test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Blocking. Errors are at zero; the remaining findings are warnings
    # (mostly no-explicit-any, see eslint.config.mjs).
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
